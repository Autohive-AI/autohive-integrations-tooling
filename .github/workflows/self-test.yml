name: Self Test

on:
  push:
    branches: [master, main]
    paths:
      - 'action.yml'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - 'scripts/**'
      - 'src/hiveup/**'
      - 'tests/**'
      - '.github/workflows/self-test.yml'

  pull_request:
    branches: [master, main]
    paths:
      - 'action.yml'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - 'scripts/**'
      - 'src/hiveup/**'
      - 'tests/**'
      - '.github/workflows/self-test.yml'

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    name: Test Validation Scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dev tools
        run: pip install -r requirements-dev.txt -q

      - name: Test validate_integration.py — good integrations pass
        run: |
          python scripts/validate_integration.py tests/examples/good-integration
          python scripts/validate_integration.py tests/examples/modular-integration
          python scripts/validate_integration.py tests/sample-api
          python scripts/validate_integration.py tests/examples/netlify

      - name: Test validate_integration.py — bad integration fails
        run: |
          if python scripts/validate_integration.py tests/examples/Bad-Integration 2>&1; then
            echo "❌ Expected validation to fail for Bad-Integration"
            exit 1
          fi
          echo "✅ Bad-Integration correctly rejected"

      - name: Test validate_integration.py — auto-discovery skips tests/
        run: |
          OUTPUT=$(python scripts/validate_integration.py 2>&1)
          if echo "$OUTPUT" | grep -q "Bad-Integration\|good-integration\|sample-api"; then
            echo "❌ Auto-discovery should not pick up test examples"
            exit 1
          fi
          echo "✅ Auto-discovery correctly skips tests/"

      - name: Test check_imports.py — valid imports
        run: |
          python scripts/check_imports.py tests/examples/submodule-imports/valid_submodules.py
          python scripts/check_imports.py tests/examples/relative-imports/mypackage/subpackage/valid_relative.py

      - name: Test check_imports.py — invalid imports detected
        run: |
          if python scripts/check_imports.py tests/examples/submodule-imports/invalid_submodules.py 2>&1; then
            echo "❌ Expected import check to fail for invalid_submodules.py"
            exit 1
          fi
          echo "✅ Invalid submodule imports correctly detected"

      - name: Test check_imports.py — invalid relative imports detected
        run: |
          if python scripts/check_imports.py tests/examples/relative-imports/mypackage/subpackage/invalid_relative.py 2>&1; then
            echo "❌ Expected import check to fail for invalid_relative.py"
            exit 1
          fi
          echo "✅ Invalid relative imports correctly detected"

      - name: Test check_imports.py — verify-names flag
        run: |
          python scripts/check_imports.py --verify-names tests/examples/name-verification/valid_names.py

          if python scripts/check_imports.py --verify-names tests/examples/name-verification/invalid_names.py 2>&1; then
            echo "❌ Expected --verify-names to fail for invalid_names.py"
            exit 1
          fi
          echo "✅ Name verification correctly detected invalid names"

      - name: Test check_imports.py — error exit code for missing file
        run: |
          python scripts/check_imports.py nonexistent.py 2>&1 || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 2 ]; then
            echo "❌ Expected exit code 2 for missing file, got ${EXIT_CODE:-0}"
            exit 1
          fi
          echo "✅ Missing file correctly returns exit code 2"

      - name: Test check_code.py — good integration
        run: python scripts/check_code.py tests/examples/good-integration

      - name: Test check_code.py — modular integration
        run: python scripts/check_code.py tests/examples/modular-integration

      - name: Test check_code.py — long lines pass with ruff.toml config
        run: python scripts/check_code.py tests/examples/long-lines-integration

      - name: Test run_tests.py — SDK 2.0.1 unit fixtures
        run: python scripts/run_tests.py tests/examples/good-integration tests/examples/modular-integration tests/examples/long-lines-integration tests/sample-api

      - name: Test check_code.py — ruff.toml applied from different working directory
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/check_code.py" "$GITHUB_WORKSPACE/tests/examples/long-lines-integration"

      - name: Test check_config_sync.py — good integration passes
        run: python scripts/check_config_sync.py tests/examples/good-integration

      - name: Test check_config_sync.py — mismatched config detected
        run: |
          if python scripts/check_config_sync.py tests/examples/config-mismatch 2>&1; then
            echo "❌ Expected config sync check to fail for config-mismatch"
            exit 1
          fi
          echo "✅ Config-code mismatch correctly detected"

      - name: Test check_config_sync.py — input drift warns for existing integrations
        run: |
          OUTPUT=$(python scripts/check_config_sync.py --base-ref HEAD tests/examples/input-drift 2>&1)
          if ! echo "$OUTPUT" | grep -q "historic warning"; then
            echo "❌ Expected input drift to be treated as historic warning for existing integration"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ Existing integration input drift warned without failing"

      - name: Test check_config_sync.py — base ref works from outside repository
        run: |
          OUTPUT=$(cd /tmp && python "$GITHUB_WORKSPACE/scripts/check_config_sync.py" --base-ref HEAD "$GITHUB_WORKSPACE/tests/examples/input-drift" 2>&1)
          if ! echo "$OUTPUT" | grep -q "historic warning"; then
            echo "❌ Expected absolute-path input drift check to resolve base ref from integration repo"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ Base ref resolved correctly when run outside the repository"

      - name: Test check_config_sync.py — renamed integrations remain existing integrations
        run: |
          TMP_REPO=$(mktemp -d)
          trap 'rm -rf "$TMP_REPO"' EXIT
          cd "$TMP_REPO"
          git init -q
          git config user.email test@example.com
          git config user.name Test
          mkdir -p old-integration
          cat > old-integration/config.json <<'JSON'
          {
            "entry_point": "main.py",
            "actions": {
              "get_data": {
                "input_schema": {
                  "type": "object",
                  "properties": {
                    "unused_param": {"type": "string"}
                  }
                }
              }
            }
          }
          JSON
          cat > old-integration/main.py <<'PY'
          app = None

          @app.action("get_data")
          class GetData:
              def execute(self, inputs):
                  return inputs.get("undocumented_param")
          PY
          git add old-integration
          git commit -q -m base
          BASE_REF=$(git rev-parse HEAD)
          git mv old-integration renamed-integration
          git commit -q -m rename

          OUTPUT=$(python "$GITHUB_WORKSPACE/scripts/check_config_sync.py" --base-ref "$BASE_REF" renamed-integration 2>&1)
          if ! echo "$OUTPUT" | grep -q "historic warning"; then
            echo "❌ Expected renamed integration input drift to remain warning-only"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ Renamed integration input drift warned without failing"

      - name: Test check_config_sync.py — input drift fails for new integrations
        run: |
          cp -R tests/examples/input-drift tmp-input-drift
          trap 'rm -rf tmp-input-drift' EXIT
          if python scripts/check_config_sync.py --base-ref HEAD tmp-input-drift 2>&1; then
            echo "❌ Expected input drift to fail for new integration"
            exit 1
          fi
          echo "✅ New integration input drift correctly failed"

      - name: Test check_config_sync.py — invalid base ref returns processing error
        run: |
          python scripts/check_config_sync.py --base-ref definitely-not-a-ref tests/examples/good-integration 2>&1 || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 2 ]; then
            echo "❌ Expected exit code 2 for invalid base ref, got ${EXIT_CODE:-0}"
            exit 1
          fi
          echo "✅ Invalid base ref correctly returns exit code 2"

      - name: Test check_config_sync.py — focused pytest regressions
        run: pytest tests/test_check_config_sync.py

      - name: Test check_code.py — input drift warns for existing integrations
        run: |
          OUTPUT=$(python scripts/check_code.py --base-ref HEAD tests/examples/input-drift 2>&1)
          if ! echo "$OUTPUT" | grep -q "historic warning"; then
            echo "❌ Expected input drift warning to flow through check_code.py"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ Existing integration input drift warned through check_code.py"

      - name: Test check_code.py — input drift fails for new integrations
        run: |
          cp -R tests/examples/input-drift tmp-input-drift
          trap 'rm -rf tmp-input-drift' EXIT
          OUTPUT=$(python scripts/check_code.py --base-ref HEAD tmp-input-drift 2>&1) && {
            echo "❌ Expected input drift to fail through check_code.py for new integration"
            echo "$OUTPUT"
            exit 1
          }
          if ! echo "$OUTPUT" | grep -q "New integrations must keep config.json input_schema in sync with code"; then
            echo "❌ Expected new-integration config-sync failure to flow through check_code.py"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ New integration input drift correctly failed through check_code.py"

      - name: Test check_code.py — invalid base ref returns processing error
        run: |
          python scripts/check_code.py --base-ref definitely-not-a-ref tests/examples/good-integration 2>&1 || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 2 ]; then
            echo "❌ Expected exit code 2 for invalid base ref through check_code.py, got ${EXIT_CODE:-0}"
            exit 1
          fi
          echo "✅ Invalid base ref correctly returns exit code 2 through check_code.py"

      - name: Test validate_integration.py — deprecated SDK pin warns
        run: |
          OUTPUT=$(python scripts/validate_integration.py tests/examples/sdk-deprecated-pin 2>&1)
          if ! echo "$OUTPUT" | grep -q "deprecated"; then
            echo "❌ Expected deprecation warning for sdk-deprecated-pin (~=1.0.2)"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ Deprecated SDK pin correctly warned"

      - name: Test validate_integration.py — wrong icon size fails
        run: |
          if python scripts/validate_integration.py tests/examples/bad-icon 2>&1; then
            echo "❌ Expected validation to fail for bad-icon (100x100 PNG)"
            exit 1
          fi
          echo "✅ Wrong icon size correctly rejected"

      - name: Test check_fetch_pattern.py — good integration passes (SDK 2.x with .data)
        run: python scripts/check_fetch_pattern.py tests/examples/good-integration

      - name: Test check_fetch_pattern.py — SDK 1.x old pattern is fine
        run: python scripts/check_fetch_pattern.py tests/examples/sdk-deprecated-pin

      - name: Test check_fetch_pattern.py — SDK 2.x old pattern detected
        run: |
          if python scripts/check_fetch_pattern.py tests/examples/sdk-v2-old-fetch-pattern 2>&1; then
            echo "❌ Expected fetch pattern check to fail for sdk-v2-old-fetch-pattern"
            exit 1
          fi
          echo "✅ Old fetch pattern with SDK 2.x correctly detected"

      - name: Test check_version_bump.py — good integration passes (no changes vs HEAD)
        run: python scripts/check_version_bump.py HEAD tests/examples/good-integration

      - name: Test check_version_bump.py — missing version detected for new integration
        run: |
          # Create a temp integration with no version in config.json
          mkdir -p /tmp/test-no-version
          echo '{"name": "test", "description": "test", "entry_point": "main.py", "actions": {}}' > /tmp/test-no-version/config.json
          if python scripts/check_version_bump.py HEAD /tmp/test-no-version 2>&1; then
            echo "❌ Expected version check to fail for integration without version"
            exit 1
          fi
          echo "✅ Missing version correctly detected"
          rm -rf /tmp/test-no-version

      - name: Test check_version_bump.py — missing directory is skipped (not failed)
        run: python scripts/check_version_bump.py HEAD nonexistent-directory

      - name: Test get_changed_dirs.py — missing argument
        run: |
          if python scripts/get_changed_dirs.py 2>&1; then
            echo "❌ Expected failure with no arguments"
            exit 1
          fi
          echo "✅ Missing argument correctly rejected"

  test-deployment-packaging:
    runs-on: ubuntu-latest
    name: Test HiveUp deployment packaging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install HiveUp
        run: python -m pip install -e . -q

      - name: Create representative integrations
        shell: bash
        run: |
          set -euo pipefail
          for fixture in no-dependencies pure-python native-wheel; do
            mkdir -p "$RUNNER_TEMP/$fixture"
            cp tests/examples/good-integration/icon.png "$RUNNER_TEMP/$fixture/icon.png"
            printf 'fixture = object()\n' > "$RUNNER_TEMP/$fixture/fixture.py"
            cat > "$RUNNER_TEMP/$fixture/config.json" <<'JSON'
          {
            "name": "fixture",
            "version": "1.0.0",
            "entry_point": "fixture.py"
          }
          JSON
          done
          : > "$RUNNER_TEMP/no-dependencies/requirements.txt"
          printf 'idna==3.10\n' > "$RUNNER_TEMP/pure-python/requirements.txt"
          printf 'multidict==6.6.3\n' > "$RUNNER_TEMP/native-wheel/requirements.txt"

      - name: Package deployment fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in no-dependencies pure-python native-wheel; do
            hiveup package "$RUNNER_TEMP/$fixture" \
              --skip-validate \
              --output "$RUNNER_TEMP/$fixture.zip"
          done

      - name: Verify deployment archives
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          archives = {}
          for fixture in ("no-dependencies", "pure-python", "native-wheel"):
              with zipfile.ZipFile(root / f"{fixture}.zip") as archive:
                  names = archive.namelist()
                  assert names == sorted(names), names
                  assert {"config.json", "fixture.py", "icon.png", "requirements.txt"} <= set(names)
                  assert not any(name.endswith(".pyc") for name in names)
                  assert not any(name.startswith("tests/") for name in names)
                  archives[fixture] = names

          assert not any(name.startswith("dependencies/") for name in archives["no-dependencies"])
          assert any(name.startswith("dependencies/idna/") for name in archives["pure-python"])
          assert not any(name.endswith(".so") for name in archives["pure-python"])
          assert any(
              name.startswith("dependencies/multidict/")
              and name.endswith(".cpython-313-x86_64-linux-gnu.so")
              for name in archives["native-wheel"]
          )
          PY

  test-action-fixtures:
    runs-on: ubuntu-latest
    name: Test Action — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: good integration
            directory: tests/examples/good-integration
            integration: good-integration
            outcome: success
            structure: success
            code: success
          - name: modular integration
            directory: tests/examples/modular-integration
            integration: modular-integration
            outcome: success
            structure: success
            code: success
          - name: long-lines integration
            directory: tests/examples/long-lines-integration
            integration: long-lines-integration
            outcome: success
            structure: success
            code: success
          - name: sample API
            directory: tests/sample-api
            integration: sample-api
            outcome: success
            structure: success
            code: success
          - name: bad icon
            directory: tests/examples/bad-icon
            integration: bad-icon
            outcome: failure
            structure: failure
            code: success
            failure_text: 512x512
          - name: invalid integration
            directory: tests/examples/Bad-Integration
            integration: Bad-Integration
            outcome: failure
            structure: failure
            code: failure
            failure_text: invalid syntax
          - name: config mismatch
            directory: tests/examples/config-mismatch
            integration: config-mismatch
            outcome: failure
            structure: failure
            code: failure
            failure_text: missing_in_code
          - name: input drift fixture
            directory: tests/examples/input-drift
            integration: input-drift
            outcome: failure
            structure: failure
            code: failure
            failure_text: requirements.txt
          - name: legacy Netlify fixture
            directory: tests/examples/netlify
            integration: netlify
            outcome: failure
            structure: success
            code: failure
            failure_text: 'Missing module: context'
          - name: deprecated SDK fixture
            directory: tests/examples/sdk-deprecated-pin
            integration: sdk-deprecated-pin
            outcome: failure
            structure: success
            code: failure
            failure_text: 'Missing module: context'
          - name: old fetch pattern
            directory: tests/examples/sdk-v2-old-fetch-pattern
            integration: sdk-v2-old-fetch-pattern
            outcome: failure
            structure: success
            code: failure
            failure_text: response.data
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run local composite Action
        id: validate
        continue-on-error: true
        uses: ./
        with:
          directories: ${{ matrix.directory }}
          post_comment: 'false'

      - name: Verify Action result and outputs
        if: always()
        shell: bash
        env:
          ACTUAL_OUTCOME: ${{ steps.validate.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXPECTED_INTEGRATION: ${{ matrix.integration }}
          EXPECTED_STRUCTURE: ${{ matrix.structure }}
          EXPECTED_CODE: ${{ matrix.code }}
          EXPECTED_FAILURE_TEXT: ${{ matrix.failure_text }}
          DIRECTORIES: ${{ steps.validate.outputs.directories }}
          STRUCTURE_RESULT: ${{ steps.validate.outputs.structure_result }}
          CODE_RESULT: ${{ steps.validate.outputs.code_result }}
          TESTS_RESULT: ${{ steps.validate.outputs.tests_result }}
          README_RESULT: ${{ steps.validate.outputs.readme_result }}
          VERSION_RESULT: ${{ steps.validate.outputs.version_result }}
          STRUCTURE_OUTPUT: ${{ steps.validate.outputs.structure_output }}
          CODE_OUTPUT: ${{ steps.validate.outputs.code_output }}
          TESTS_OUTPUT: ${{ steps.validate.outputs.tests_output }}
          COMMENT_PATH: ${{ steps.validate.outputs.comment_path }}
        run: |
          set -euo pipefail

          [ "$ACTUAL_OUTCOME" = "$EXPECTED_OUTCOME" ] || {
            echo "Expected Action outcome '$EXPECTED_OUTCOME', got '$ACTUAL_OUTCOME'"
            exit 1
          }
          [ "$DIRECTORIES" = "$EXPECTED_INTEGRATION" ] || {
            echo "Expected directories output '$EXPECTED_INTEGRATION', got '$DIRECTORIES'"
            exit 1
          }
          [ "$STRUCTURE_RESULT" = "$EXPECTED_STRUCTURE" ] || {
            echo "Expected structure result '$EXPECTED_STRUCTURE', got '$STRUCTURE_RESULT'"
            exit 1
          }
          [ "$CODE_RESULT" = "$EXPECTED_CODE" ] || {
            echo "Expected code result '$EXPECTED_CODE', got '$CODE_RESULT'"
            exit 1
          }
          [ "$TESTS_RESULT" = success ]
          [ "$README_RESULT" = success ]
          [ "$VERSION_RESULT" = success ]
          [ -f "$COMMENT_PATH" ]
          grep -Fq "[$EXPECTED_INTEGRATION]" "$COMMENT_PATH"

          if [ -n "$EXPECTED_FAILURE_TEXT" ]; then
            grep -Fq "$EXPECTED_FAILURE_TEXT" \
              <<< "$STRUCTURE_OUTPUT"$'\n'"$CODE_OUTPUT"$'\n'"$TESTS_OUTPUT"
          fi

  test-action-changed-discovery:
    runs-on: ubuntu-latest
    name: Test Action — changed-directory discovery
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit a new valid integration fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.email test@example.com
          git config user.name Test
          echo "base_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp -R tests/examples/good-integration action-fixture
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("action-fixture/config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["name"] = "action-fixture"
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          printf '\n- `action-fixture` — composite Action test fixture\n' >> README.md
          git add action-fixture README.md
          git commit -m "test: add action discovery fixture"

      - name: Run local composite Action with a base ref
        id: validate
        uses: ./
        with:
          base_ref: ${{ steps.fixture.outputs.base_ref }}
          post_comment: 'false'

      - name: Verify discovered directory and outputs
        shell: bash
        env:
          DIRECTORIES: ${{ steps.validate.outputs.directories }}
          STRUCTURE_RESULT: ${{ steps.validate.outputs.structure_result }}
          CODE_RESULT: ${{ steps.validate.outputs.code_result }}
          TESTS_RESULT: ${{ steps.validate.outputs.tests_result }}
          README_RESULT: ${{ steps.validate.outputs.readme_result }}
          VERSION_RESULT: ${{ steps.validate.outputs.version_result }}
          COMMENT_PATH: ${{ steps.validate.outputs.comment_path }}
        run: |
          set -euo pipefail
          [ "$DIRECTORIES" = action-fixture ]
          [ "$STRUCTURE_RESULT" = success ]
          [ "$CODE_RESULT" = success ]
          [ "$TESTS_RESULT" = success ]
          [ "$README_RESULT" = success ]
          [ "$VERSION_RESULT" = success ]
          [ -f "$COMMENT_PATH" ]
          grep -Fq '[action-fixture]' "$COMMENT_PATH"

  test-action-comment-lifecycle:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Test Action — sticky comment lifecycle
    permissions:
      contents: read
      pull-requests: write
    env:
      COMMENT_HEADER: hiveup-action-self-test-${{ github.run_id }}
      COMMENT_MARKER: '<!-- Sticky Pull Request Commenthiveup-action-self-test-${{ github.run_id }} -->'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create sticky comment
        uses: ./
        with:
          directories: tests/examples/good-integration
          post_comment: 'true'
          comment_header: ${{ env.COMMENT_HEADER }}

      - name: Verify sticky comment creation
        id: created
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENTS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | jq -s 'add')
          COMMENT_COUNT=$(jq --arg marker "$COMMENT_MARKER" '[.[] | select(.body | contains($marker))] | length' <<< "$COMMENTS")
          [ "$COMMENT_COUNT" -eq 1 ]
          COMMENT_ID=$(jq -r --arg marker "$COMMENT_MARKER" '.[] | select(.body | contains($marker)) | .id' <<< "$COMMENTS")
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          COMMENT_BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
          grep -Fq '[good-integration]' <<< "$COMMENT_BODY"

      - name: Replace sticky comment
        uses: ./
        with:
          directories: tests/examples/modular-integration
          post_comment: 'true'
          comment_header: ${{ env.COMMENT_HEADER }}

      - name: Verify sticky comment replacement
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CREATED_COMMENT_ID: ${{ steps.created.outputs.comment_id }}
        run: |
          set -euo pipefail
          COMMENTS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | jq -s 'add')
          COMMENT_COUNT=$(jq --arg marker "$COMMENT_MARKER" '[.[] | select(.body | contains($marker))] | length' <<< "$COMMENTS")
          [ "$COMMENT_COUNT" -eq 1 ]
          COMMENT_ID=$(jq -r --arg marker "$COMMENT_MARKER" '.[] | select(.body | contains($marker)) | .id' <<< "$COMMENTS")
          [ "$COMMENT_ID" = "$CREATED_COMMENT_ID" ]
          COMMENT_BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
          grep -Fq '[modular-integration]' <<< "$COMMENT_BODY"
          if grep -Fq '[good-integration]' <<< "$COMMENT_BODY"; then
            echo 'Sticky comment retained stale validation output'
            exit 1
          fi

      - name: Delete sticky comment through empty discovery
        uses: ./
        with:
          base_ref: HEAD
          post_comment: 'true'
          comment_header: ${{ env.COMMENT_HEADER }}

      - name: Verify sticky comment deletion
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENTS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | jq -s 'add')
          COMMENT_COUNT=$(jq --arg marker "$COMMENT_MARKER" '[.[] | select(.body | contains($marker))] | length' <<< "$COMMENTS")
          [ "$COMMENT_COUNT" -eq 0 ]

      - name: Clean up lifecycle test comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ env.COMMENT_HEADER }}
          delete: true
