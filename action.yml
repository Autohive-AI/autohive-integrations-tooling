name: Validate Integration
description: >
  Validates Autohive integrations — structure, code quality, and README updates.
  Posts a sticky PR comment with results.

inputs:
  base_ref:
    description: >
      Git ref to diff against for detecting changed directories (e.g. origin/main).
      Required when directories is not provided.
    required: false
  directories:
    description: >
      Space-separated list of integration directories to validate.
      If not provided, directories are auto-detected via git diff against base_ref.
    required: false
  python_version:
    description: Python version to use
    required: false
    default: '3.13'
  post_comment:
    description: Post a sticky PR comment with results (requires pull-requests write permission)
    required: false
    default: 'true'
  comment_header:
    description: Header used to identify the sticky PR comment
    required: false
    default: validation-results

outputs:
  directories:
    description: Space-separated list of integration directories that were validated
    value: ${{ steps.ci.outputs.directories }}
  structure_result:
    description: "'success' or 'failure'"
    value: ${{ steps.ci.outputs.structure_result }}
  code_result:
    description: "'success' or 'failure'"
    value: ${{ steps.ci.outputs.code_result }}
  readme_result:
    description: "'success' or 'failure'"
    value: ${{ steps.ci.outputs.readme_result }}
  version_result:
    description: "'success' or 'failure'"
    value: ${{ steps.ci.outputs.version_result }}
  tests_result:
    description: "'success' or 'failure'"
    value: ${{ steps.ci.outputs.tests_result }}
  structure_output:
    description: Full output of the structure check
    value: ${{ steps.ci.outputs.structure_output }}
  code_output:
    description: Full output of the code check
    value: ${{ steps.ci.outputs.code_output }}
  readme_output:
    description: Full output of the README check
    value: ${{ steps.ci.outputs.readme_output }}
  version_output:
    description: Full output of the version check
    value: ${{ steps.ci.outputs.version_output }}
  tests_output:
    description: Full output of the test runner
    value: ${{ steps.ci.outputs.tests_output }}
  comment_path:
    description: >
      Path to a file containing the rendered Markdown PR comment body.
      Empty when no integration directories changed. Useful for callers
      that want to upload the comment as an artifact and post it from a
      separate workflow (e.g. workflow_run) — typically required for
      pull requests opened from forks, where the pull_request event
      runs with a read-only GITHUB_TOKEN.
    value: ${{ steps.ci.outputs.comment_path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install hiveup
      shell: bash
      run: pip install ${{ github.action_path }} -q

    - name: Run hiveup CI validation
      id: ci
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ inputs.directories }}" ] && [ -z "${{ inputs.base_ref }}" ]; then
          echo "::error::Either 'base_ref' or 'directories' input is required"
          exit 1
        fi
        BASE_REF_ARGS=()
        if [ -n "${{ inputs.base_ref }}" ]; then
          BASE_REF_ARGS=(--base-ref "${{ inputs.base_ref }}")
        fi
        COMMENT_FILE="${{ runner.temp }}/validation-comment.md"
        COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
        if [ -n "${{ inputs.directories }}" ]; then
          hiveup ci "${BASE_REF_ARGS[@]}" ${{ inputs.directories }} \
            --github-annotations \
            --commit "$COMMIT" \
            --comment-file "$COMMENT_FILE" \
            --output-file "$GITHUB_OUTPUT"
        else
          hiveup ci "${BASE_REF_ARGS[@]}" \
            --github-annotations \
            --commit "$COMMIT" \
            --comment-file "$COMMENT_FILE" \
            --output-file "$GITHUB_OUTPUT"
        fi

    - name: Delete stale PR comment
      if: always() && steps.ci.outputs.directories == '' && inputs.post_comment == 'true'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: ${{ inputs.comment_header }}
        delete: true

    - name: Post PR comment
      if: always() && steps.ci.outputs.directories != '' && inputs.post_comment == 'true'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: ${{ inputs.comment_header }}
        path: ${{ steps.ci.outputs.comment_path }}

    - name: Fail if any check failed
      if: always() && steps.ci.outcome == 'failure'
      shell: bash
      run: exit 1
